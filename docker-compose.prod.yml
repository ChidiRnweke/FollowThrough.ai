services:
  app:
    image: ghcr.io/chidirnweke/followthrough.ai:latest
    restart: unless-stopped
    environment:
      CONFIG_SOURCE: ${CONFIG_SOURCE:-infisical}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT}
      INFISICAL_URL: ${INFISICAL_URL}
      # Overrides the image default; must be in the environment before node starts.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-52428800}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel_collector:4317}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-followthrough}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-followthrough}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
    labels:
      caddy: notes.chidinweke.be
      caddy.reverse_proxy: '{{upstreams 3000}}'
    networks:
      - reverse-proxy
      - postgres-network
      - rustfs-network
      - telemetry-network

  # Single instance by design: the tasks discover their work from the database on
  # every tick, so a second replica would only duplicate embedding calls.
  worker:
    image: ghcr.io/chidirnweke/followthrough.ai:latest
    restart: unless-stopped
    command: ['node', '--import', './scripts/otel-instrumentation.js', 'build-worker/worker.js']
    deploy:
      replicas: 1
    environment:
      CONFIG_SOURCE: ${CONFIG_SOURCE:-infisical}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT}
      INFISICAL_URL: ${INFISICAL_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel_collector:4317}
      OTEL_SERVICE_NAME: ${OTEL_WORKER_SERVICE_NAME:-followthrough-worker}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-followthrough}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
    networks:
      - postgres-network
      - rustfs-network
      - telemetry-network

  migrate:
    image: ghcr.io/chidirnweke/followthrough.ai:latest
    command: ['sh', '-c', 'node scripts/provision-db.js && node scripts/prod-migrate.js']
    profiles: [setup]
    restart: 'no'
    labels:
      komodo.skip: 'true'
    environment:
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT}
      INFISICAL_URL: ${INFISICAL_URL}
      INFISICAL_ADMIN_CLIENT_ID: ${INFISICAL_ADMIN_CLIENT_ID}
      INFISICAL_ADMIN_CLIENT_SECRET: ${INFISICAL_ADMIN_CLIENT_SECRET}
      INFISICAL_ADMIN_PROJECT_ID: ${INFISICAL_ADMIN_PROJECT_ID}
      DB_NAME: ${DB_NAME:-followthrough}
      DB_USER: ${DB_USER:-followthrough}
    networks:
      - postgres-network

networks:
  reverse-proxy:
    external: true
  postgres-network:
    external: true
  rustfs-network:
    external: true
  telemetry-network:
    external: true
