services:
  app:
    image: ghcr.io/chidirnweke/followthrough.ai:latest
    restart: unless-stopped
    environment:
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT}
      INFISICAL_URL: ${INFISICAL_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel_collector:4317}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-followthrough}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-followthrough}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
    labels:
      caddy: notes.chidinweke.be
      caddy.reverse_proxy: "{{upstreams 3000}}"
    networks:
      - reverse-proxy
      - postgres-network
      - rustfs-network
      - telemetry-network

  migrate:
    image: ghcr.io/chidirnweke/followthrough.ai:latest
    command:
      [
        "sh",
        "-c",
        "node scripts/provision-db.js && node scripts/prod-migrate.js",
      ]
    profiles: [setup]
    restart: "no"
    labels:
      komodo.skip: "true"
    environment:
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT}
      INFISICAL_URL: ${INFISICAL_URL}
      INFISICAL_ADMIN_CLIENT_ID: ${INFISICAL_ADMIN_CLIENT_ID}
      INFISICAL_ADMIN_CLIENT_SECRET: ${INFISICAL_ADMIN_CLIENT_SECRET}
      INFISICAL_ADMIN_PROJECT_ID: ${INFISICAL_ADMIN_PROJECT_ID}
    networks:
      - postgres-network

networks:
  reverse-proxy:
    external: true
  postgres-network:
    external: true
  rustfs-network:
    external: true
  telemetry-network:
    external: true
