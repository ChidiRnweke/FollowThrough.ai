name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  # dorny/paths-filter fetches the changed-files list from the REST API on PRs.
  pull-requests: read

env:
  # The app boots against plain environment variables; nothing here talks to
  # Infisical or any real provider. The contract suite spins its own Postgres
  # via Testcontainers, and e2e uses the service container below.
  CONFIG_SOURCE: env
  OPENROUTER_BASE_URL: http://127.0.0.1:9
  OPENROUTER_API_KEY: playwright-not-used
  MISTRAL_API_KEY: playwright-not-used

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Release-please PRs touch only CHANGELOG.md, the release manifest and the
      # package.json version. The ruleset requires this check to report a result on
      # every PR, so skip the heavy steps but still finish the job green when nothing
      # behavioral changed.
      - if: github.event_name == 'pull_request'
        id: release-only
        uses: dorny/paths-filter@v3
        with:
          # 'every' makes the negatives real exclusions: a changed file counts as
          # behavioral only when it matches '**' and is not one of the release-managed
          # files. package.json is skipped because release-please bumps the version there;
          # a real dependency change also updates pnpm-lock.yaml, which stays behavioral.
          predicate-quantifier: 'every'
          filters: |
            behavioral:
              - '**'
              - '!CHANGELOG.md'
              - '!.release-please-manifest.json'
              - '!package.json'
      - if: github.event_name == 'pull_request' && steps.release-only.outputs.behavioral == 'false'
        run: echo "Only release-managed files changed; skipping quality checks"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm lint
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm check
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm test:architecture
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm docs:check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        id: release-only
        uses: dorny/paths-filter@v3
        with:
          # 'every' makes the negatives real exclusions: a changed file counts as
          # behavioral only when it matches '**' and is neither release-managed file.
          predicate-quantifier: 'every'
          filters: |
            behavioral:
              - '**'
              - '!CHANGELOG.md'
              - '!.release-please-manifest.json'
              - '!package.json'
      - if: github.event_name == 'pull_request' && steps.release-only.outputs.behavioral == 'false'
        run: echo "Only release-managed files changed; skipping unit tests"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm test:unit
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm test:browser:full

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        id: release-only
        uses: dorny/paths-filter@v3
        with:
          # 'every' makes the negatives real exclusions: a changed file counts as
          # behavioral only when it matches '**' and is neither release-managed file.
          predicate-quantifier: 'every'
          filters: |
            behavioral:
              - '**'
              - '!CHANGELOG.md'
              - '!.release-please-manifest.json'
              - '!package.json'
      - if: github.event_name == 'pull_request' && steps.release-only.outputs.behavioral == 'false'
        run: echo "Only release-managed files changed; skipping contracts"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'push' || steps.release-only.outputs.behavioral == 'true'
        run: pnpm test:contracts

  # Not a required merge check: run it only after merge to master to catch
  # offline-synchronization regressions that the faster PR gates miss.
  sync-pwa:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:sync:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sync-pwa-failures
          path: |
            test-results/
            playwright-report/
