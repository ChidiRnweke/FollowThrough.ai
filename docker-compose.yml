services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: followthrough
      POSTGRES_USER: followthrough
      POSTGRES_PASSWORD: followthrough
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U followthrough -d followthrough']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - followthrough-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: followthrough
      MINIO_ROOT_PASSWORD: followthrough-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - followthrough-objects:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ['/bin/sh', '-c']
    command:
      [
        'until mc alias set local http://minio:9000 followthrough followthrough-local-secret; do sleep 1; done; mc mb --ignore-existing local/followthrough-attachments'
      ]

volumes:
  followthrough-data:
  followthrough-objects:
