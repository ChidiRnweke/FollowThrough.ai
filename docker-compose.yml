services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: followthrough
      POSTGRES_USER: followthrough
      POSTGRES_PASSWORD: followthrough
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U followthrough -d followthrough']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - followthrough-data:/var/lib/postgresql/data

  rustfs-perms:
    image: alpine
    user: root
    volumes:
      - followthrough-objects:/data
    command: chown -R 10001:10001 /data

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: followthrough
      RUSTFS_SECRET_KEY: followthrough-local-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - followthrough-objects:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      PHOENIX_API_KEY: ${PHOENIX_API_KEY}
    ports:
      - '4317:4317'
      - '4318:4318'

volumes:
  followthrough-data:
  followthrough-objects:
