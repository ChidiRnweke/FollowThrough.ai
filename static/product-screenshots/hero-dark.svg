<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">How FollowThrough works</title><desc id="d">Project context — notes, todos, memory, draw.io diagrams, widgets, skills and files — flows into the agent. The agent acts: it writes notes, updates todos, proposes memory, draws draw.io diagrams, builds widgets, creates skills and exports Word and PDF documents. Accepted work is saved to the project and becomes context for the next task.</desc>
